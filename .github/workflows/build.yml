name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore TapBPM.sln

      - name: Build
        run: dotnet build TapBPM.sln -c Release --no-restore

      - name: Test
        run: dotnet test TapBPM.sln -c Release --no-build --verbosity normal

      - name: Publish
        run: dotnet publish src/TapBpm/TapBpm.csproj -c Release -o artifacts/publish

      # Inno Setup ships with the windows-latest runner image.
      - name: Build installer
        run: iscc installer\TapBPM.iss

      - uses: actions/upload-artifact@v4
        with:
          name: installer
          path: artifacts/TapBPM-*-setup.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/TapBPM-*-setup.exe
          generate_release_notes: true
